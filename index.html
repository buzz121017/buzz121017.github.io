<style>
  :root{
    --bg:#0E1114; --card:#161B20; --card2:#1A2027; --line:#26313A;
    --txt:#E9EFF3; --dim:#8A99A6; --mint:#3EE6B0; --red:#FF6B6B;
    --mint-soft:rgba(62,230,176,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    min-height:100dvh;padding:calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 40px);
    display:flex;flex-direction:column;justify-content:center;max-width:560px;margin:0 auto;
    line-height:1.55;letter-spacing:-.01em;
  }
  .brand{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;color:var(--mint);font-weight:700}
  .brand i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint);display:inline-block}
  h1{margin:14px 0 6px;font-size:30px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--mint)}
  .lede{margin:0 0 26px;color:var(--dim);font-size:14.5px}
  .grid{display:grid;gap:12px}
  a.app{
    display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;
    transition:border-color .18s ease,transform .18s ease,background .18s ease;
  }
  a.app:active{transform:scale(.985);background:var(--card2)}
  @media (hover:hover){a.app:hover{border-color:rgba(62,230,176,.55)}}
  a.app .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  a.app .tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mint);background:var(--mint-soft);
    border:1px solid rgba(62,230,176,.25);border-radius:999px;padding:4px 9px;white-space:nowrap}
  a.app h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
  a.app p{margin:8px 0 0;font-size:13.5px;color:var(--dim)}
  a.app .go{margin-top:12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--mint)}
  a.app .go svg{width:14px;height:14px;flex:none}
  footer{margin-top:26px;font-size:12px;color:#61707C;line-height:1.7}
  footer b{color:var(--dim);font-weight:700}
</style>

  <div class="brand"><i></i><span>TROUBLE LAB</span></div>

      <div class="top">
        <h2>성분 궁합 체커</h2>
        <span class="tag">누구나 사용</span>

    </a>
  </div>
